<title>Counterstock Inventory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: white rail of modules + roomy card grid; touch-friendly register UI with big targets */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#F1F4F2; --line:#E2E7E4; --ink:#17201B; --muted:#5D6A63;
  --side:#FFFFFF; --side-ink:#36433C; --side-act:#E6F4EB; --side-act-ink:#136B33; --side-line:#E2E7E4;
  --accent:#1E8A45; --accent-hi:#18733A; --accent-ink:#FFFFFF; --accent-soft:#E4F3E9;
  --warn:#93590A; --warn-soft:#FFF2D9; --danger:#B42330; --danger-soft:#FCE6E8;
  --ok:#1D7238; --ok-soft:#E1F3E6; --info:#2257A6; --info-soft:#E3ECFA;
  --s1:#2a78d6; --s2:#eb6834; --bar:#1E8A45; --bar-prev:#C9D3CD;
  --paper:#FFFFFF; --paper-ink:#000000;
  --shadow-sm:0 1px 2px rgba(16,32,22,.06),0 1px 1px rgba(16,32,22,.04);
  --shadow:0 12px 32px rgba(16,32,22,.16);
  --r:12px; --r-sm:8px;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1311; --surface:#161D19; --surface-2:#1C2520; --line:#2A3630; --ink:#E5ECE8; --muted:#9AA8A0;
  --side:#121815; --side-ink:#B9C6BF; --side-act:#1B3224; --side-act-ink:#86DCA2; --side-line:#24302A;
  --accent:#3BB765; --accent-hi:#4CC874; --accent-ink:#04140A; --accent-soft:#163323;
  --warn:#F0B44C; --warn-soft:#382A0E; --danger:#F27C84; --danger-soft:#3D1519;
  --ok:#6BCB8A; --ok-soft:#15301E; --info:#86AEF0; --info-soft:#18284A;
  --s1:#3987e5; --s2:#d95926; --bar:#3BB765; --bar-prev:#3A4741; --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 12px 32px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#161D19; --surface-2:#1C2520; --line:#2A3630; --ink:#E5ECE8; --muted:#9AA8A0;
  --side:#121815; --side-ink:#B9C6BF; --side-act:#1B3224; --side-act-ink:#86DCA2; --side-line:#24302A;
  --accent:#3BB765; --accent-hi:#4CC874; --accent-ink:#04140A; --accent-soft:#163323;
  --warn:#F0B44C; --warn-soft:#382A0E; --danger:#F27C84; --danger-soft:#3D1519;
  --ok:#6BCB8A; --ok-soft:#15301E; --info:#86AEF0; --info-soft:#18284A;
  --s1:#3987e5; --s2:#d95926; --bar:#3BB765; --bar-prev:#3A4741; --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 12px 32px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f-body);margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:17px} h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:.9em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px} .right{text-align:right}
a{color:var(--accent);font-weight:500}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);border-right:1px solid var(--side-line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;gap:11px;align-items:center;padding:20px 18px 12px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-mark i{display:block;width:18px;height:15px;background:repeating-linear-gradient(90deg,var(--accent-ink) 0 2px,transparent 2px 3px,var(--accent-ink) 3px 4px,transparent 4px 6px)}
.brand b{display:block;color:var(--ink);font-size:17px;font-weight:800;letter-spacing:-.01em}
.brand small{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 12px 16px}
.nav-h{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;padding:16px 12px 6px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:14.5px;font-weight:500;color:var(--side-ink)}
.nav button:hover{background:var(--surface-2)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav button.on{background:var(--side-act);color:var(--side-act-ink);font-weight:700}
.nav svg{width:20px;height:20px;flex:none}
.nav .cnt{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;border-radius:10px;padding:1px 7px;font-weight:700}
.side-foot{margin-top:auto;padding:14px 16px 18px;border-top:1px solid var(--side-line);display:flex;gap:10px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.side-foot .who{min-width:0;font-size:12.5px;line-height:1.35}
.side-foot .who b{display:block;font-size:13.5px;color:var(--ink)}
.side-foot button{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:12.5px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px max(20px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px));min-height:64px}
.top .grow{flex:1}
.top .menu-btn{display:none}
.store-chip{display:flex;align-items:center;gap:8px;font-weight:700}
.store-chip svg{width:18px;height:18px;color:var(--accent)}
.gsearch{position:relative;flex:1;max-width:420px;min-width:180px}
.gsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.gsearch .in{padding-left:38px;background:var(--surface-2);border-color:transparent;border-radius:999px;height:40px}
.gsearch .in:focus{background:var(--surface)}
.gres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);z-index:40;max-height:420px;overflow:auto;padding:6px}
.gres h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 10px 4px}
.gres button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;font-size:13.5px}
.gres button:hover,.gres button:focus-visible{background:var(--surface-2)}
.content{padding:24px max(20px,env(safe-area-inset-right,0px)) 64px max(20px,env(safe-area-inset-left,0px));max-width:1400px;width:100%}
.page-h{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.page-h p{margin:4px 0 0;color:var(--muted);max-width:72ch}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:0 14px;height:40px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap;font-size:14px;box-shadow:var(--shadow-sm);transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.dan{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.lg{height:52px;padding:0 22px;font-size:16px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.lbl{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;height:40px;min-width:0}
textarea.in{resize:vertical;min-height:80px;padding:10px 12px;height:auto}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.check{display:flex;gap:9px;align-items:center;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.paybox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.paybox label{border:2px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:10px;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:15px;min-height:58px;background:var(--surface)}
.paybox label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--side-act-ink)}
.paybox input{width:20px;height:20px;accent-color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.seg button:focus-visible{outline:2px solid var(--accent)}

/* filter bar */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.filters .in{width:auto;min-width:150px}
.range{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.range svg{width:18px;height:18px;color:var(--accent)}
.range select.in{font-weight:600}
.range input[type=date]{width:150px}
.range-note{font-size:12.5px;color:var(--muted)}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:var(--shadow-sm)}
.card-h{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow-sm);min-width:0}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:12px;padding:1px 7px;border-radius:99px}
.delta.up{background:var(--ok-soft);color:var(--ok)} .delta.down{background:var(--danger-soft);color:var(--danger)} .delta.flat{background:var(--surface-2);color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl td.wrap{min-width:240px}
.tbl .in{height:34px;padding:0 8px}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.dan{background:var(--danger-soft);color:var(--danger)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--side-act-ink)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.tabs button{all:unset;cursor:pointer;padding:9px 16px;font-weight:600;color:var(--muted);border-radius:99px;white-space:nowrap;background:var(--surface);border:1px solid var(--line)}
.tabs button.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* tooltip + help */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:var(--ink);color:var(--surface);font:500 12.5px/1.45 var(--f-body);padding:8px 10px;border-radius:8px;width:max-content;max-width:260px;white-space:pre-line;z-index:80;pointer-events:none;text-transform:none;letter-spacing:0;box-shadow:var(--shadow);text-align:left}
[data-tip].tip-b:hover::after,[data-tip].tip-b:focus-visible::after{bottom:auto;top:calc(100% + 8px)}
[data-tip].tip-l:hover::after{left:auto;right:0;transform:none}
.qi{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--surface-2);font-size:11px;font-weight:800;color:var(--muted);cursor:help;flex:none}
.howto{background:var(--info-soft);border-radius:var(--r);margin-bottom:16px}
.howto summary{cursor:pointer;padding:12px 16px;font-weight:700;color:var(--info);list-style:none;display:flex;gap:8px;align-items:center}
.howto summary::-webkit-details-marker{display:none}
.howto summary::before{content:"?";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--info);color:var(--surface);font-size:12px}
.howto ol{margin:0;padding:0 20px 16px 42px;display:grid;gap:6px;max-width:95ch}
.howto li::marker{font-weight:800;color:var(--info)}

/* ---------- home launcher ---------- */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hello h1{font-size:28px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.tile{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .12s,border-color .12s;position:relative;min-height:128px;box-sizing:border-box}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .ti{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile .ti svg{width:26px;height:26px}
.tile b{font-size:16px;font-weight:700}
.tile span{font-size:13px;color:var(--muted);line-height:1.4}
.tile .badge{position:absolute;top:14px;right:14px;background:var(--danger);color:#fff;font-size:12px;font-weight:800;border-radius:99px;padding:2px 9px}
.tile.c2 .ti{background:var(--info-soft);color:var(--info)} .tile.c3 .ti{background:var(--warn-soft);color:var(--warn)} .tile.c4 .ti{background:var(--danger-soft);color:var(--danger)}
.attn{display:flex;flex-direction:column}
.attn button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.attn button:last-child{border-bottom:0}
.attn button:hover{background:var(--surface-2)}
.attn .n{min-width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--surface-2)}
.attn .n.dan{background:var(--danger-soft);color:var(--danger)} .attn .n.warn{background:var(--warn-soft);color:var(--warn)} .attn .n.ok{background:var(--ok-soft);color:var(--ok)}
.attn .go{margin-left:auto;color:var(--muted)}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}

/* ---------- charts (HTML bars, one scale, hover tooltips) ---------- */
.vchart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;height:260px}
.vy{display:flex;flex-direction:column;justify-content:space-between;font-size:11.5px;color:var(--muted);text-align:right;padding-bottom:22px;font-variant-numeric:tabular-nums}
.vy span{line-height:0}
.vplot{position:relative;display:flex;flex-direction:column;min-width:0}
.vgrid{position:absolute;inset:0 0 22px 0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.vgrid i{display:block;border-top:1px solid var(--line)}
.vgrid i:last-child{border-top:1px solid var(--muted);opacity:.5}
.vbars{position:relative;flex:1;display:flex;align-items:flex-end;gap:2px}
.vcol{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:default;min-width:0}
.vcol .vbar{width:100%;max-width:38px;background:var(--bar);border-radius:4px 4px 0 0;min-height:0;transition:filter .1s}
.vcol:hover .vbar,.vcol:focus-visible .vbar{filter:brightness(1.18)}
.vcol:focus-visible{outline:none}
.vx{height:22px;display:flex;gap:2px;font-size:11px;color:var(--muted)}
.vx span{flex:1;text-align:center;white-space:nowrap;overflow:visible;min-width:0;padding-top:5px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hrow{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.hrow .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htrack{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.htrack i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.htrack.alt i{background:var(--s2)} .htrack.acc i{background:var(--bar)}
.hrow .hv{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;min-width:70px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.split{display:flex;height:16px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.split i{display:block;height:100%}

/* ---------- register ---------- */
.reg{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.scan{display:flex;gap:8px;align-items:stretch}
.scan .in{font:500 17px var(--f-mono);height:52px;border-width:2px;border-radius:12px}
.scan .btn{height:52px}
.scan-hint{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:12px}
.chip{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:2px 7px;font:12px var(--f-mono);cursor:pointer;color:var(--muted)}
.chip:hover{border-color:var(--accent);color:var(--accent)}

function parseCSV(t){const rows=[];let row=[],f='',q=false;t=t.replace(/^﻿/,'');
 for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}else f+=c}
 row.push(f);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}

 ['qty_ordered','Qty ordered',1,['qty_ordered','quantity','ordered','qty']],['qty_received','Qty received',0,['qty_received','received','shipped','total shipped quantity']],['unit_cost','Unit cost',1,['unit_cost','unit price','price','cost']],
 ['vendor_order_no','Vendor order #',0,['vendor_order_no','order #','order no','order','po number','sales order']],['order_date','Order date',0,['order_date','purchased on','order date','date']],['tracking_no','Tracking #',0,['tracking_no','tracking number','tracking']],
 ['vendor','Vendor',0,['vendor','supplier']],['category','Category',0,['category']],['brand','Brand',0,['brand']],['model','Fits model',0,['model']],['mpn','MPN',0,['mpn']],['upc','UPC',0,['upc','item upc']],['sell_price','Sell price',0,['sell_price','retail']],['min_stock','Min stock',0,['min_stock','threshold']]];
function guessCat(n){n=n.toLowerCase();if(n.includes('battery'))return'Batteries';if(/lcd|oled/.test(n))return'Screens';if(/back (cover )?glass/.test(n))return'Back Glass';if(/cable|charger|charging stand/.test(n)&&!n.includes('flex'))return'Cables & Chargers';if(/earbud|headphone|keyboard|mouse|speaker|smartwatch/.test(n)&&!/loudspeaker|earpiece/.test(n))return'Audio & Accessories';if(n.includes('case'))return'Cases';if(/iphone|galaxy|pixel/.test(n)&&/\d+gb/.test(n))return'Devices';return'Small Parts'}
function startImport(text,fileName){const rows=parseCSV(text);if(rows.length<2){toast('That file has no data rows. Check it is a CSV export.');return}
 const headers=rows[0].map(h=>h.trim());const lc=headers.map(h=>h.toLowerCase());const map={};
 for(const [k,,,syn] of MAPF){let ix=-1;for(const s of syn){ix=lc.indexOf(s);if(ix>=0)break}map[k]=ix}
 const isExport=lc.includes('product sku')&&lc.includes('customer group');
 UI.imp={step:'map',fileName,headers,rows:rows.slice(1),map,vendor:isExport?'Parts Supplier (web export)':'',detected:isExport?'Parts supplier web export (Orders_*.csv) — columns matched automatically. Shipping rows are skipped.':lc.includes('vendor_sku')?'Counterstock CSV template':'Unknown layout — check the column matches below.',printAfter:true};render()}
function buildReview(){const I=UI.imp,m=I.map,g=(r,k)=>m[k]>=0?String(r[m[k]]??'').trim().replace(/^'/,''):'';const lines=[],ship={};
 for(const r of I.rows){const sku=g(r,'vendor_sku'),name=g(r,'product_name');const ref=g(r,'vendor_order_no')||I.ref||'MANUAL-'+isoD(Date.now());
  if(/^shipping$/i.test(sku)||(!sku&&!name)){ship[ref]=(ship[ref]||0)+(parseFloat(g(r,'unit_cost'))||parseFloat(r[headerIx('total')])||0);continue}
  const ord=Math.round(parseFloat(g(r,'qty_ordered'))||0);if(!ord&&!g(r,'qty_received'))continue;const recRaw=g(r,'qty_received');
  const match=findByCode(sku)||(g(r,'upc')&&findByCode(g(r,'upc')));const cat=g(r,'category');
  lines.push({ref,date:g(r,'order_date'),tracking:g(r,'tracking_no'),vendor:g(r,'vendor')||I.vendor,sku,name:name||(match&&match.name)||sku,ord,rec:recRaw===''?ord:Math.round(parseFloat(recRaw)||0),cost:parseFloat(g(r,'unit_cost'))||(match?match.cost:0),price:parseFloat(g(r,'sell_price'))||null,
   category:CATS.includes(cat)?cat:(match?match.category:guessCat(name)),brand:g(r,'brand'),model:g(r,'model'),mpn:g(r,'mpn'),upc:g(r,'upc'),min:g(r,'min_stock'),match:match?match.id:null,reason:''})}
 function headerIx(h){return I.headers.map(x=>x.toLowerCase()).indexOf(h)}
 I.lines=lines;I.ship=ship;I.step='review';render()}
VIEWS.receive=()=>{const sid=curStore();if(sid==='all')return needStore();const I=UI.imp;
 const head=`<div class="page-h"><div><h1>Receive stock</h1><p>When a vendor delivery arrives, upload its CSV, check what is actually in the box, and print labels for every unit. Each upload is recorded with your name, the file, and ordered vs received per product.</p></div><div class="row">${isMgr()?`<button class="btn" data-act="openImport">${ic('box')} Import existing stock</button>`:''}<button class="btn" data-act="addProduct">${ic('plus')} Add one product manually</button></div></div>
 <div class="steps"><span class="${!I?'on':'done'}">1 · Upload CSV</span><span class="${I&&I.step==='map'?'on':I&&I.step==='review'?'done':''}">2 · Check columns</span><span class="${I&&I.step==='review'?'on':''}">3 · Count & confirm</span><span>4 · Print labels</span></div>`;
 if(!I)return head+`${howto('Receiving a delivery, step by step',['Open the box and keep the vendor invoice (PDF or email) next to you.','<b>Parts supplier</b>: download the order CSV from their website (Orders_….csv) and upload it as is. <b>Hitfar, Cesium and other PDF invoices</b>: copy the lines into the CSV template below.','The system matches each line to an existing product by vendor SKU, MPN or UPC. New items are created automatically.','Count what is physically in the box. If the invoice says 12 but you have 11, change <b>Received</b> to 11 and pick a reason. The shortage is logged for that product.','Confirm. Stock goes up in this store, alerts clear, and the label sheet opens with one label per unit received.'],true)}
 <div class="cols"><div class="card card-b stack"><h2>Upload a delivery file</h2>
  <label class="field"><span>CSV file ${tip('Accepts the Counterstock template or the parts supplier\'s order export. Other layouts can be matched column by column in the next step.')}</span><input class="in" type="file" id="csvFile" accept=".csv,text/csv" data-on="csvFile"></label>
  <details><summary class="small" style="cursor:pointer">Or paste CSV text</summary><textarea class="in mono small" id="csvPaste" rows="6" placeholder="vendor,vendor_order_no,…"></textarea><button class="btn sm" data-act="csvPaste" style="margin-top:6px">Read pasted CSV</button></details>
  <div class="note info small">Try it with a real file: <button class="btn sm" data-act="sampleImport">Load sample: parts supplier export (Oct 9 orders)</button></div>
 </div>
 <div class="card"><div class="card-h"><h2>CSV template</h2><div class="row"><button class="btn sm" data-act="copyTemplate">${ic('copy')} Copy template</button>${FRAMED?'':`<button class="btn sm" data-act="dlTemplate">Download .csv</button>`}</div></div><div class="tbl-wrap" style="max-height:360px"><table class="tbl"><thead><tr><th>Column</th><th>Req.</th><th>What goes in it</th></tr></thead><tbody>${TEMPLATE_COLS.map(c=>`<tr><td class="mono small">${c[0]}</td><td>${c[1]?pill('Yes','acc'):''}</td><td class="small">${esc(c[2])}${c[3]?`<div class="muted mono">e.g. ${esc(c[3])}</div>`:''}</td></tr>`).join('')}</tbody></table></div></div></div>`;
 if(I.step==='map')return head+`<div class="card card-b stack"><div class="row" style="justify-content:space-between"><div><h2>${esc(I.fileName)}</h2><div class="small muted">${I.rows.length} rows · ${esc(I.detected)}</div></div><button class="btn sm ghost" data-act="cancelImport">Start over</button></div>
  <div class="grid g3"><label class="field"><span>Vendor ${tip('Used when the file has no vendor column.')}</span><input class="in" id="impVendor" value="${esc(I.vendor)}" placeholder="e.g. Hitfar" data-on="impField" data-k="vendor"></label><label class="field"><span>Order # (if not in file)</span><input class="in" id="impRef" value="${esc(I.ref||'')}" data-on="impField" data-k="ref"></label><div class="field"><span>Receiving into</span><div class="kpi" style="padding:7px 10px"><b>${esc(ST(sid).name)}</b></div></div></div>
  <h3>Match columns ${tip('Left: what the system needs. Right: the column in your file that holds it. Required fields are marked *.')}</h3>
  <div class="grid g4">${MAPF.map(([k,t,req])=>`<label class="field"><span>${t}${req?' *':''}</span><select class="in" id="map_${k}" data-on="mapCol" data-k="${k}"><option value="-1">— not in file —</option>${I.headers.map((h,i)=>`<option value="${i}" ${I.map[k]===i?'selected':''}>${esc(h)}</option>`).join('')}</select></label>`).join('')}</div>
  <div class="row" style="justify-content:flex-end"><button class="btn pri" data-act="toReview" ${MAPF.some(([k,,r])=>r&&I.map[k]<0)?'disabled':''}>Next: count & confirm</button></div></div>`;
 const groups={};I.lines.forEach((l,i)=>{(groups[l.ref]=groups[l.ref]||[]).push([l,i])});
 const tot=I.lines.reduce((a,l)=>({o:a.o+l.ord,r:a.r+l.rec}),{o:0,r:0});const newN=I.lines.filter(l=>!l.match).length;
 return head+`${Object.keys(groups).filter(ref=>S.batches.some(b=>b.ref===ref)).map(ref=>`<div class="note dan" style="margin-bottom:10px">Order <b>${esc(ref)}</b> was already received on ${fmtD(S.batches.find(b=>b.ref===ref).at)} by ${esc(U(S.batches.find(b=>b.ref===ref).by).name)}. Receiving it again will add the stock twice.</div>`).join('')}
 <div class="kpis"><div class="kpi"><div class="k">Lines</div><div class="v">${I.lines.length}</div><div class="s">${Object.keys(groups).length} vendor order(s)</div></div><div class="kpi"><div class="k">New products</div><div class="v">${newN}</div><div class="s">created on confirm</div></div><div class="kpi"><div class="k">Units ordered</div><div class="v">${tot.o}</div></div><div class="kpi"><div class="k">Units received</div><div class="v" style="color:${tot.r<tot.o?'var(--danger)':'inherit'}">${tot.r}</div><div class="s">${tot.r-tot.o?`${tot.r-tot.o} vs invoice`:'matches invoice'}</div></div></div>
 ${Object.entries(groups).map(([ref,ls])=>`<div class="card" style="margin-bottom:12px"><div class="card-h"><div><h2>${esc(ls[0][0].vendor||I.vendor||'Vendor?')} · order ${esc(ref)}</h2><div class="small muted">${esc(ls[0][0].date||'')} ${ls[0][0].tracking?'· tracking '+esc(ls[0][0].tracking):''} ${I.ship[ref]?'· shipping '+money(I.ship[ref]):''}</div></div></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Product</th><th>Category</th><th class="right">Unit cost</th><th class="right">Ordered</th><th class="right">Received ${tip('Count the units in the box. Change this when it differs from the invoice.')}</th><th>Reason if different</th></tr></thead><tbody>
  ${ls.map(([l,i])=>`<tr><td class="wrap">${l.match?pill('Existing','ok'):pill('New','info')} <span style="font-weight:500">${esc(l.name)}</span><div class="small mono muted">${esc(l.sku)}${l.match?' · in stock here: '+qty(sid,l.match):''}</div></td>
   <td>${l.match?esc(l.category):`<select class="in" style="width:auto" id="ic${i}" data-on="impLine" data-i="${i}" data-k="category">${CATS.map(c=>`<option ${c===l.category?'selected':''}>${c}</option>`).join('')}</select>`}</td>
   <td class="right num">${isMgr()?money(l.cost):'—'}</td><td class="right num">${l.ord}</td>
   <td class="right"><input class="in num" style="width:72px;${l.rec!==l.ord?'border-color:var(--danger)':''}" type="number" min="0" id="ir${i}" value="${l.rec}" data-on="impLine" data-i="${i}" data-k="rec"></td>
   <td>${l.rec!==l.ord?`<select class="in" style="width:auto" id="iw${i}" data-on="impLine" data-i="${i}" data-k="reason"><option value="">Pick a reason…</option>${['Short shipped','Damaged in transit','Wrong item sent','Backordered','Extra unit sent'].map(x=>`<option ${l.reason===x?'selected':''}>${x}</option>`).join('')}</select>`:'<span class="small muted">—</span>'}</td></tr>`).join('')}
  </tbody></table></div></div>`).join('')}
 <div class="card card-b row" style="justify-content:space-between"><label class="check"><input type="checkbox" id="impPrint" ${I.printAfter?'checked':''} data-on="impPrint"> Open label sheet after confirming (one label per unit received)</label><div class="row"><button class="btn" data-act="cancelImport">Cancel</button><button class="btn" data-act="backToMap">Back</button><button class="btn pri lg" data-act="confirmImport">Confirm receipt into ${esc(ST(sid).name)}</button></div></div>`};

function confirmImport(){const I=UI.imp,sid=curStore();if(I.lines.some(l=>l.rec!==l.ord&&!l.reason)){toast('Pick a reason for every line where received differs from ordered.');return}
 if(!I.lines.length){toast('No product lines were found in this file.');return}
 const groups={};I.lines.forEach(l=>{(groups[l.ref]=groups[l.ref]||[]).push(l)});const labelItems=[];let created=0;
 for(const [ref,ls] of Object.entries(groups)){const B={id:uid('b'),storeId:sid,vendor:ls[0].vendor||I.vendor||'Unknown vendor',ref,date:ls[0].date||isoD(Date.now()),tracking:ls[0].tracking,file:I.fileName,by:me().id,at:Date.now(),lines:[],shipping:I.ship[ref]||0,tax:0};
  log('IMPORT',`Uploaded ${I.fileName} — ${B.vendor} order ${ref}: ${ls.length} lines, ${ls.reduce((a,l)=>a+l.ord,0)} units ordered`,{ref:B.id});
  for(const l of ls){let p=l.match&&P(l.match);
   if(!p){const id='p'+(S.products.length+1)+uid('');const n=S.products.length+1+Math.floor(Math.random()*1e5);p={id,ean:ean13(n),vendorSku:l.sku,upc:l.upc,mpn:l.mpn,name:l.name,category:l.category,brand:l.brand,model:l.model,vendor:B.vendor,cost:l.cost,price:l.price||sellPrice(l.cost,l.category),threshold:l.min!==''&&l.min!=null&&!isNaN(+l.min)?+l.min:null,createdAt:Date.now()};S.products.push(p);created++;log('PRODUCT',`New product created from ${I.fileName}: ${p.name}`,{pid:p.id})}
   else if(l.cost&&Math.abs(l.cost-p.cost)>.004){log('PRODUCT',`Unit cost updated ${money(p.cost)} → ${money(l.cost)} from ${B.vendor} ${ref}: ${p.name}`,{pid:p.id});p.cost=l.cost}
   addStock(sid,p.id,l.rec);B.lines.push({pid:p.id,ordered:l.ord,received:l.rec,cost:l.cost,reason:l.reason});
   log('RECEIVE',`Received ${l.rec} of ${l.ord} × ${p.name} (${B.vendor} ${ref}) — now ${qty(sid,p.id)} in store`,{pid:p.id,ref:B.id});
   if(l.rec!==l.ord)log('ADJUST',`Receiving adjustment on ${B.vendor} ${ref}: ordered ${l.ord}, received ${l.rec} (${l.reason}) — ${p.name}`,{pid:p.id,ref:B.id});
   if(l.rec>0)labelItems.push({pid:p.id,copies:l.rec})}
  S.batches.unshift(B)}
 const pr=I.printAfter;UI.imp=null;save();render();toast(`Received ${Object.keys(groups).length} order(s) into ${ST(sid).name}${created?` · ${created} new products`:''}.`);
 if(pr&&labelItems.length)openLabels(labelItems,'receive')}

 return `<div class="page-h"><div><h1>Receiving history</h1><p>Every delivery uploaded into ${sid==='all'?'any store':esc(ST(sid).name)}: who uploaded it, which file, and ordered vs received. Open one to record a late (backordered) arrival.</p></div><button class="btn pri" data-act="go" data-v="receive">${ic('inbox')} Receive stock</button></div>
 <div class="filters">${rangeCtl('batches')}</div><div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Received</th><th>Vendor · order</th><th>Store</th><th>Uploaded by</th><th>File</th><th class="right">Ordered</th><th class="right">Received</th><th class="right">Value</th><th></th></tr></thead><tbody>
 ${list.map(b=>{const o=b.lines.reduce((a,l)=>a+l.ordered,0),r=b.lines.reduce((a,l)=>a+l.received,0);return `<tr class="click" data-act="openBatch" data-b="${b.id}"><td class="num">${fmtDT(b.at)}</td><td>${esc(b.vendor)}<div class="mono small muted">${esc(b.ref)}</div></td><td>${esc(ST(b.storeId).name)}</td><td>${esc(U(b.by).name)}</td><td class="small">${esc(b.file)}</td><td class="right num">${o}</td><td class="right num ${r<o?'diff-neg':''}">${r}</td><td class="right num">${isMgr()?money(b.lines.reduce((a,l)=>a+l.received*l.cost,0)):'—'}</td><td>${r<o?pill(o-r+' short','dan'):r>o?pill(r-o+' extra','warn'):pill('Complete','ok')}</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">No deliveries yet.</td></tr>'}</tbody></table></div></div>`};
function batchModal(id){const b=S.batches.find(x=>x.id===id);const o=b.lines.reduce((a,l)=>a+l.ordered,0),r=b.lines.reduce((a,l)=>a+l.received,0);

 <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Product</th><th class="right">Cost</th><th class="right">Ordered</th><th class="right">Received</th><th></th></tr></thead><tbody>${b.lines.map((l,i)=>`<tr><td class="wrap">${esc(P(l.pid).name)}<div class="small mono muted">${esc(P(l.pid).vendorSku)}</div></td><td class="right num">${isMgr()?money(l.cost):'—'}</td><td class="right num">${l.ordered}</td><td class="right num ${l.received<l.ordered?'diff-neg':''}">${l.received}${l.reason?`<div class="small">${esc(l.reason)}</div>`:''}</td><td class="right">${l.received<l.ordered?`<button class="btn sm tip-l" data-act="lateArrival" data-b="${b.id}" data-i="${i}" data-tip="The missing unit turned up later (backorder). Adds it to stock and logs it against this order.">Late arrival +1</button>`:''}</td></tr>`).join('')}</tbody></table></div>`,
 `<button class="btn" data-act="closeModal">Close</button><button class="btn pri" data-act="batchLabels" data-b="${b.id}">${ic('print')} Reprint labels</button>`,'wide')}

VIEWS.alerts=()=>{const sid=curStore();const al=computeAlerts(sid);const pa=al.filter(a=>a.kind==='product'),ca=al.filter(a=>a.kind==='category');const tab=UI.tab.alerts||'product';
 const cleared=S.log.filter(l=>l.type==='ALERT'&&l.msg.startsWith('Alert cleared')&&inStore(l,sid)).slice(0,8);

 <div class="tabs" role="tablist"><button class="${tab==='product'?'on':''}" data-act="tab" data-t="alerts" data-v="product">Products (${pa.length})</button><button class="${tab==='category'?'on':''}" data-act="tab" data-t="alerts" data-v="category">Categories (${ca.length})</button><button class="${tab==='levels'?'on':''}" data-act="tab" data-t="alerts" data-v="levels">Alert levels</button></div>

function techEditor(r){return `<div class="card card-b stack" style="border-color:var(--accent)"><h3>Technician update</h3><div class="grid g2">
 <label class="field"><span>Complexity</span><select class="in" id="t_cx">${['','Simple','Moderate','Complex'].map(x=>`<option ${r.complexity===x?'selected':''} value="${x}">${x||'Not assessed'}</option>`).join('')}</select></label>

/* ---- Technician panel ---- */
VIEWS.tech=()=>{const tab=UI.tab.tech||'pickup';const mine=S.repairs.filter(r=>r.tech===me().id||me().role!=='tech');
 const pick=mine.filter(r=>r.status==='dispatch'),bench=mine.filter(r=>r.status==='tech'),deliver=mine.filter(r=>['fixed','notfix'].includes(r.status));
 const m0=new Date();m0.setDate(1);m0.setHours(0,0,0,0);const billed=mine.filter(r=>r.repairCost!=null&&r.history.some(h=>['fixed','notfix'].includes(h.status)&&h.at>=m0.getTime()-40*DAY));
 const rowT=r=>`<tr class="click" data-act="openRepair" data-r="${r.id}"><td class="mono">${r.id}</td><td>${esc(r.device)}<div class="small muted">${r.damage.map(esc).join(', ')}</div></td><td class="small">${esc(r.desc)}</td><td>${repPill(r.status)}</td><td class="num small">${r.expected?fmtD(r.expected):'—'}</td><td class="right num">${r.repairCost!=null?money(r.repairCost):'—'}</td></tr>`;
 const byShop=list=>S.stores.map(s=>({s,l:list.filter(r=>r.storeId===s.id)})).filter(x=>x.l.length);
 return `<div class="page-h"><div><h1>Technician panel</h1><p>Your round across all shops: what to collect, what is on your bench, and what to bring back. Set complexity, cost of repair, shipment charges and the delivery date on each job.</p></div></div>
 <div class="kpis"><div class="kpi"><div class="k">To collect</div><div class="v">${pick.length}</div><div class="s">from ${new Set(pick.map(r=>r.storeId)).size} shops</div></div><div class="kpi"><div class="k">On bench</div><div class="v">${bench.length}</div></div><div class="kpi"><div class="k">To deliver back</div><div class="v">${deliver.length}</div></div><div class="kpi"><div class="k">Billed (recent)</div><div class="v">${money(billed.reduce((a,r)=>a+(r.repairCost||0)+(r.shipCost||0),0))}</div><div class="s">repair + shipping</div></div></div>
 <div class="tabs"><button class="${tab==='pickup'?'on':''}" data-act="tab" data-t="tech" data-v="pickup">Pickups by shop (${pick.length})</button><button class="${tab==='bench'?'on':''}" data-act="tab" data-t="tech" data-v="bench">My bench (${bench.length})</button><button class="${tab==='deliver'?'on':''}" data-act="tab" data-t="tech" data-v="deliver">Deliver back (${deliver.length})</button><button class="${tab==='bill'?'on':''}" data-act="tab" data-t="tech" data-v="bill">Billing</button></div>
 ${tab==='pickup'?(byShop(pick).map(({s,l})=>`<div class="card" style="margin-bottom:12px"><div class="card-h"><div><h2>${esc(s.name)}</h2><div class="small muted">${esc(s.address)} ${s.phone?'· '+esc(s.phone):''}</div></div><button class="btn pri sm" data-act="collectShop" data-s="${s.id}">Collected all ${l.length}</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ticket</th><th>Device</th><th>Fault</th><th>Status</th><th>Expected</th><th class="right">Cost</th></tr></thead><tbody>${l.map(rowT).join('')}</tbody></table></div></div>`).join('')||'<div class="card empty">Nothing to collect right now.</div>'):''}
 ${tab==='bench'?`<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ticket</th><th>Device</th><th>Fault</th><th>Status</th><th>Delivery date</th><th class="right">Cost</th></tr></thead><tbody>${bench.map(rowT).join('')||'<tr><td colspan="6" class="empty">Bench is empty.</td></tr>'}</tbody></table></div></div>`:''}
 ${tab==='deliver'?(byShop(deliver).map(({s,l})=>`<div class="card" style="margin-bottom:12px"><div class="card-h"><h2>${esc(s.name)}</h2><button class="btn pri sm" data-act="deliverShop" data-s="${s.id}">Delivered all ${l.length}</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ticket</th><th>Device</th><th>Fault</th><th>Status</th><th>Date</th><th class="right">Cost</th></tr></thead><tbody>${l.map(rowT).join('')}</tbody></table></div></div>`).join('')||'<div class="card empty">Nothing to deliver.</div>'):''}
 ${tab==='bill'?`<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Shop</th><th class="right">Jobs</th><th class="right">Repairs</th><th class="right">Shipping</th><th class="right">Total to bill</th></tr></thead><tbody>${S.stores.map(s=>{const l=billed.filter(r=>r.storeId===s.id);const a=l.reduce((x,r)=>x+(r.repairCost||0),0),b=l.reduce((x,r)=>x+(r.shipCost||0),0);return `<tr><td>${esc(s.name)}</td><td class="right num">${l.length}</td><td class="right num">${money(a)}</td><td class="right num">${money(b)}</td><td class="right num"><b>${money(a+b)}</b></td></tr>`}).join('')}</tbody></table></div></div>`:''}`};

/* ---- Store exchange ---- */
VIEWS.exchange=()=>{const sid=curStore();const q=(UI.xq||'').toLowerCase().trim();const words=q.split(/\s+/).filter(Boolean);
 const res=words.length?S.products.filter(p=>words.every(w=>(p.name+' '+p.vendorSku+' '+p.model+' '+p.ean).toLowerCase().includes(w))&&S.stores.some(s=>s.id!==sid&&qty(s.id,p.id)>0)).slice(0,40):[];
 const tr=S.transfers.filter(t=>sid==='all'||t.from===sid||t.to===sid).sort((a,b)=>b.at-a.at);
 const stLbl={requested:['Requested','warn'],shipped:['On the way','info'],received:['Received','ok'],declined:['Declined','dan']};
 return `<div class="page-h"><div><h1>Store exchange</h1><p>Search what the other shops have in stock, request it, and track it until it arrives. Stock leaves the sending shop when it is dispatched and lands in yours when you mark it received.</p></div></div>
 ${howto('Getting a product from another shop',['Search the product (e.g. "iPhone 17 Pro Max"). Only shops that have it are listed, with their quantity.','Press <b>Request</b>, enter quantity and a note (e.g. "customer waiting").','The other shop sees it under <b>Requests to us</b> and presses <b>Dispatch</b> when it leaves.','When it arrives, press <b>Mark received</b>. Both shops\' stock and the activity log update.'])}
 <div class="card card-b" style="margin-bottom:12px"><label class="field"><span>Search other stores' inventory</span><input class="in" id="xq" placeholder="e.g. iPhone 17 Pro Max, S24 Ultra screen" value="${esc(UI.xq||'')}" data-on="xq" autofocus></label>
 ${words.length?`<div class="tbl-wrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>Product</th>${S.stores.map(s=>`<th class="right">${esc(s.name)}${s.id===sid?' (you)':''}</th>`).join('')}</tr></thead><tbody>${res.map(p=>`<tr><td class="wrap">${esc(p.name)}<div class="small muted">${esc(p.category)} · ${money(p.price)}</div></td>${S.stores.map(s=>{const n=qty(s.id,p.id);return `<td class="right num">${s.id===sid||sid==='all'?`<b>${n}</b>`:n>0?`<b>${n}</b> <button class="btn sm" data-act="reqTransfer" data-p="${p.id}" data-from="${s.id}">Request</button>`:'<span class="muted">0</span>'}</td>`}).join('')}</tr>`).join('')||`<tr><td colspan="${S.stores.length+1}" class="empty">No other store has a match in stock.</td></tr>`}</tbody></table></div>`:''}</div>
 <div class="card"><div class="card-h"><h2>Transfers</h2></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Product</th><th>From → To</th><th>Requested</th><th>Status</th><th></th></tr></thead><tbody>${tr.map(t=>{const outgoing=t.from===sid,incoming=t.to===sid;return `<tr><td class="mono">${t.id}</td><td class="wrap">${t.items.map(i=>`${i.qty} × ${esc(P(i.pid).name)}`).join('<br>')}${t.note?`<div class="small muted">“${esc(t.note)}”</div>`:''}</td><td>${esc(ST(t.from).name)} → ${esc(ST(t.to).name)}</td><td class="small">${fmtDT(t.at)}<div class="muted">${esc(U(t.by).name)}</div></td><td>${pill(...stLbl[t.status])}</td><td class="right">${t.status==='requested'&&(outgoing||sid==='all')?`<button class="btn sm pri" data-act="trStep" data-t="${t.id}" data-s="shipped">Dispatch</button> <button class="btn sm" data-act="trStep" data-t="${t.id}" data-s="declined">Decline</button>`:''}${t.status==='shipped'&&(incoming||sid==='all')?`<button class="btn sm pri" data-act="trStep" data-t="${t.id}" data-s="received">Mark received</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No transfers yet.</td></tr>'}</tbody></table></div></div>`};
function transferForm(pid,from){const p=P(pid);modal('Request from '+esc(ST(from).name),`<p><b>${esc(p.name)}</b></p><div class="small muted">${esc(ST(from).name)} has ${qty(from,pid)} · you have ${qty(curStore(),pid)}</div>
 <form id="tform" class="stack" data-form="saveTransfer" data-p="${pid}" data-from="${from}"><label class="field"><span>Quantity</span><input class="in num" id="t_qty" type="number" min="1" max="${qty(from,pid)}" value="1" autofocus></label><label class="field"><span>Note for the other shop</span><input class="in" id="t_note" placeholder="e.g. Customer waiting, need by 4pm"></label></form>`,

VIEWS.shifts=()=>{const sid=curStore();const mgr=isMgr();let list=S.shifts.filter(x=>inRange('shifts',x.openAt)&&inStore(x,sid)&&(mgr||x.userId===me().id)).sort((a,b)=>b.openAt-a.openAt);
 const sh=openShift();

 ${howto('Opening and closing the till',['When you sign in you are asked for the <b>opening balance</b>: count the float in the drawer and enter it.','Every sale where you tick <b>Cash deposit</b> is added to your shift automatically.','At the end of the day press <b>End shift</b>. The system shows the cash you collected.','If cash was spent (e.g. $100 for a courier), change the deposit amount and write a note. The difference and your note are saved for the admin.'])}
 <div class="filters">${rangeCtl('shifts')}</div><div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Staff</th>${sid==='all'?'<th>Store</th>':''}<th>Opened</th><th>Closed</th><th class="right">Opening</th><th class="right">Cash collected</th><th class="right">Deposit handed over</th><th class="right">Difference</th><th>Note</th></tr></thead><tbody>
 ${list.map(x=>{const c=x.closeAt?x.cashCollected??shiftCash(x).cash:shiftCash(x).cash;const diff=x.closeAt?r2(x.declared-c):0;return `<tr><td>${esc(U(x.userId).name)}</td>${sid==='all'?`<td>${esc(ST(x.storeId).name)}</td>`:''}<td class="num small">${fmtDT(x.openAt)}</td><td class="num small">${x.closeAt?fmtDT(x.closeAt):pill('Open','ok')}</td><td class="right num">${money(x.opening)}</td><td class="right num">${money(c)}</td><td class="right num">${x.closeAt?money(x.declared):'—'}</td><td class="right num ${diff<0?'diff-neg':diff>0?'diff-pos':''}">${x.closeAt?(diff?money(diff):'0.00'):''}</td><td class="small wrap">${esc(x.note||'')}</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">No shifts yet.</td></tr>'}</tbody></table></div></div>`};

 ${sid==='all'?`<label class="field"><span>Store</span><select class="in" id="ls" data-on="logF" data-k="store"><option value="">All stores</option>${S.stores.map(s=>`<option value="${s.id}" ${F.store===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`:'<div></div>'}</div></div>
 <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>When</th><th>Type</th><th>What happened</th><th>Employee</th>${sid==='all'?'<th>Store</th>':''}</tr></thead><tbody>${list.slice(0,300).map(l=>`<tr><td class="num small" style="white-space:nowrap">${fmtDT(l.at)}</td><td><span class="tag ${l.type}">${l.type}</span></td><td class="wrap">${l.pid&&P(l.pid)?`<a href="#" data-act="openProduct" data-p="${l.pid}" style="color:inherit">${esc(l.msg)}</a>`:esc(l.msg)}</td><td>${esc(U(l.by).name)}</td>${sid==='all'?`<td>${esc(ST(l.storeId).name)}</td>`:''}</tr>`).join('')||'<tr><td colspan="5" class="empty">Nothing matches these filters.</td></tr>'}</tbody></table></div>${list.length>300?`<div class="small muted card-b">Showing 300 of ${list.length}. Narrow the filters to see older entries.</div>`:''}</div>`};

/* ---- Guide ---- */
VIEWS.guide=()=>`<div class="page-h"><div><h1>Daily guide</h1><p>How a normal day runs in every shop, and who does what. Each screen also has its own "How to" panel and <span class="qi">?</span> tips on the fields.</p></div></div>
 <div class="cols even">
 ${[['Opening the shop (staff)',['Sign in with your own account. Never use someone else\'s: every action is logged under your name.','Count the float and enter the <b>opening balance</b>.','Open <b>Inventory alerts</b> and note anything out of stock.','Check <b>Store exchange</b> for requests from other shops and dispatch them.']],
   ['When a delivery arrives',['Download the vendor\'s order CSV or fill the template from the PDF invoice.','<b>Receive stock</b> → upload → check the matched columns.','Count the box. Fix <b>Received</b> where it differs and pick a reason.','Confirm, then print and stick one label on every unit.']],
   ['Selling',['<b>Sell / Scan out</b>, scan every item.','Tick <b>Cash deposit</b> or <b>Debit / card</b> (both for split payments).','Complete the sale and hand over the receipt.']],
   ['Returns and exchanges',['Scan the returned item, set its value and condition.','Find or add the customer (name, email, mobile, national ID).','Scan anything they take instead, add an adjustment if agreed.','Confirm and give the credit slip.']],
   ['Repairs',['<b>New repair</b> with damage and fault notes, print the repair label.','Dispatch to the technician with an expected date.','When it comes back: <b>Back in shop</b>, call the customer, then <b>Collected</b>.']],
   ['Closing (staff)',['<b>End shift</b>. Check the cash collected.','If you spent cash, change the deposit and write why.','Hand the deposit to the admin.']],
   ['Store admin, weekly',['<b>Receiving history</b>: chase vendors for every red "short" line.','<b>Shifts & cash</b>: review differences and notes.','<b>Alert levels</b>: adjust per category for the season.']],
   ['Super admin',['Pick <b>All stores</b> to compare shops.','<b>Stores & users</b>: add a store, then its admin.','<b>Activity log</b>: filter by store or employee for any question.']]]
  .map(([h,s])=>`<div class="card card-b"><h2 style="margin-bottom:8px">${h}</h2><ol style="margin:0;padding-left:20px;display:grid;gap:4px">${s.map(x=>`<li>${x}</li>`).join('')}</ol></div>`).join('')}</div>
 <div class="card" style="margin-top:16px"><div class="card-h"><h2>How vendor files map in</h2></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Vendor file</th><th>What it contains</th><th>How to load it</th></tr></thead><tbody>
 <tr><td><b>Parts supplier</b> · Orders_YYYY-MM-DD.csv</td><td>Order #, Product SKU, Product Description, Unit Price, Quantity, Tracking Number. Shipping is a separate "Shipping" row.</td><td>Upload as is. Columns match automatically and shipping rows are skipped. Each Order # becomes its own delivery.</td></tr>
 <tr><td><b>Hitfar</b> · Order history PDF</td><td>Product, quantity, price, Hitfar SKU, MPN, shipped and backorder quantity.</td><td>Fill the template: Hitfar SKU → vendor_sku, MPN → mpn, Quantity → qty_ordered, Total shipped → qty_received.</td></tr>
 <tr><td><b>Cesium Telecom</b> · Sales order PDF</td><td>Item code, description, ordered, shipped, price, UPC.</td><td>Fill the template: Item code → vendor_sku, Ordered/Shipped → qty columns, Item UPC → upc (then the retail box barcode also scans).</td></tr>
 <tr><td>Any other vendor</td><td>Any CSV with at least SKU, description, quantity and price.</td><td>Upload it and match the columns on the second step.</td></tr></tbody></table></div></div>`;

  const sub=r2(UI.cart.reduce((a,l)=>a+l.price*l.qty,0));const cust=UI.cartCust&&C(UI.cartCust);const credit=cust&&UI.useCredit?Math.min(cust.credit,sub):0;const due=r2(sub-credit);

  let cash=UI.payCash&&UI.payCard?r2(Math.min(due,Math.max(0,+(UI.cashPart??due/2)||0))):UI.payCash?due:0;const card=r2(due-cash);
  const sale={id:'S'+(++S.seq.sale),storeId:sid,at:Date.now(),by:me().id,shiftId:openShift().id,items:UI.cart.map(l=>({...l})),total:sub,pay:{cash,card,credit},customerId:cust?cust.id:null};
  S.sales.push(sale);for(const l of sale.items){addStock(sid,l.pid,-l.qty);log('SALE',`Scanned out ${l.qty} × ${P(l.pid).name} — ${money(l.price*l.qty)}${l.list&&l.price<l.list?` (discount ${money((l.list-l.price)*l.qty)} off ${money(l.list)})`:''} (${[cash?'Cash':'',card?'Card':'',credit?'Credit':''].filter(Boolean).join(' + ')}) · ${qty(sid,l.pid)} left`,{pid:l.pid,ref:sale.id})}
  if(credit){cust.credit=r2(cust.credit-credit);S.credits.push({id:uid('CL'),customerId:cust.id,at:Date.now(),storeId:sid,by:me().id,type:'redeem',amount:-credit,ref:sale.id,note:'Used on sale '+sale.id});log('CREDIT',`${cust.name} used ${money(credit)} store credit on ${sale.id} — balance ${money(cust.credit)}`,{ref:sale.id})}
  UI.cart=[];UI.cartCust=null;UI.useCredit=false;UI.payCash=UI.payCard=false;UI.cashPart=null;UI.lastHit=null;UI.scanErr='';save();render();showReceipt(saleReceiptData(sale))},

 confirmReturn:()=>{const sid=curStore(),R=UI.ret,k=retCalc();if(!R.items.length||!k.cust)return;
  if(R.items.some(i=>!(+i.value>=0))){toast('Enter a return value for each item.');return}
  if(k.pay>0&&!R.payCash&&!R.payCard){toast(`Tick how the customer pays the ${money(k.pay)} difference.`);return}
  if(k.pay>0&&R.payCash&&!openShift()){toast('Start your shift first so the cash is counted.');shiftOpenModal(false);return}
  const short=R.exch.find(i=>qty(sid,i.pid)<1);if(short){toast(`"${P(short.pid).name}" is not in stock here.`);return}
  const now=Date.now(),no='CR-'+(++S.seq.receipt),c=k.cust,by=me().id;
  if(k.net>0&&R.refundMethod==='cash'&&!openShift()){toast('Start your shift first: a cash refund comes out of the till.');shiftOpenModal(false);return}
  const rec={id:uid('R'),receipt:no,storeId:sid,at:now,by,shiftId:openShift()?openShift().id:null,customerId:c.id,items:R.items.map(i=>({...i,value:r2(+i.value),restock:i.condition==='resell'})),exch:R.exch.map(i=>({...i,price:r2(+i.price)})),adjust:k.adj,adjustNote:R.adjustNote,net:k.net,usedOld:k.useOld,collected:k.pay?{cash:R.payCash?k.pay:0,card:R.payCash?0:k.pay}:null};
  const L=(type,amount,note)=>{if(amount)S.credits.push({id:uid('CL'),customerId:c.id,at:now,storeId:sid,by,type,amount:r2(amount),ref:no,note})};
  L('return',k.rv,'Returned '+rec.items.map(i=>P(i.pid).name).join(', '));L('exchange',-k.ev,rec.exch.length?'Took '+rec.exch.map(i=>P(i.pid).name).join(', '):'');L('adjust',k.adj,R.adjustNote||'Adjustment');
  if(k.net<0){L('redeem',-k.useOld,'Existing credit used');L('payment',k.pay,`Customer paid difference by ${R.payCash?'cash':'card'}`)}
  const rm=k.net>0?(R.refundMethod||'credit'):'credit';rec.refundMethod=rm;
  if(rm!=='credit'){L('refund',-k.net,`Refunded ${money(k.net)} by ${rm==='cash'?'cash from till':'debit / card'}`);rec.refunded={method:rm,amount:k.net}}
  c.credit=r2(c.credit+(k.net>=0?(rm==='credit'?k.net:0):-k.useOld));rec.balanceAfter=c.credit;
  for(const i of rec.items){if(i.restock)addStock(sid,i.pid,1);log('RETURN',`${no}: ${c.name} returned ${P(i.pid).name} valued ${money(i.value)} — ${i.restock?'back in stock':'faulty, not restocked'}${i.note?' · '+i.note:''}`,{pid:i.pid,ref:no})}
  for(const i of rec.exch){addStock(sid,i.pid,-1);log('RETURN',`${no}: ${c.name} took ${P(i.pid).name} in exchange at ${money(i.price)} · ${qty(sid,i.pid)} left`,{pid:i.pid,ref:no})}
  log('CREDIT',`${no}: ${k.net>=0?(rm==='credit'?`${money(k.net)} store credit issued to`:`${money(k.net)} refunded (${rm}) to`):`${money(-k.net)} owed by`} ${c.name}${k.adj?` (adjustment ${money(k.adj)}${R.adjustNote?': '+R.adjustNote:''})`:''} — balance now ${money(c.credit)}`,{ref:no});
  S.returns.push(rec);UI.ret=null;save();render();showReceipt(returnReceiptData(rec))},

const PRESETS=[['today','Today'],['yesterday','Yesterday'],['7d','Last 7 days'],['30d','Last 30 days'],['month','This month'],['lastmonth','Last month'],['90d','Last 90 days'],['all','All time'],['custom','Custom dates…']];

function getRange(k){UI.range=UI.range||{};const r=UI.range[k]||(UI.range[k]={p:RDEF[k]||'30d',from:isoD(Date.now()-6*DAY),to:isoD(Date.now())});
 const t0=today0();let a,b=Date.now()+1;const d=new Date();
 switch(r.p){case'today':a=t0;break;case'yesterday':a=t0-DAY;b=t0;break;case'7d':a=t0-6*DAY;break;case'30d':a=t0-29*DAY;break;case'90d':a=t0-89*DAY;break;
  case'month':a=new Date(d.getFullYear(),d.getMonth(),1).getTime();break;
  case'lastmonth':a=new Date(d.getFullYear(),d.getMonth()-1,1).getTime();b=new Date(d.getFullYear(),d.getMonth(),1).getTime();break;
  case'all':a=0;break;
  case'custom':{a=new Date(r.from+'T00:00').getTime();b=new Date(r.to+'T00:00').getTime()+DAY;if(!(b>a)){b=a+DAY}break}}
 const label=r.p==='custom'?`${fmtD(a)} – ${fmtD(b-1)}`:r.p==='all'?'All time':`${fmtD(a)} – ${fmtD(Math.min(b,Date.now())-1)}`;
 return{a,b,p:r.p,label}}

/* ---- formatting & chart helpers ---- */
const fmtK=n=>{n=+n||0;const a=Math.abs(n);return (n<0?'−':'')+'$'+(a>=1e6?(a/1e6).toFixed(1)+'M':a>=1e4?Math.round(a/1e3)+'k':a>=1e3?(a/1e3).toFixed(1)+'k':Math.round(a))};
const pct=(n,d)=>d?Math.round(n/d*100):0;
function delta(cur,prev,p){if(p==='all'||prev==null)return'';if(!prev&&!cur)return'<span class="delta flat">—</span>';if(!prev)return'<span class="delta up">new</span>';
 const ch=(cur-prev)/Math.abs(prev)*100;const k=Math.abs(ch)<0.5?'flat':ch>0?'up':'down';return `<span class="delta ${k}" title="vs previous period">${k==='up'?'▲':k==='down'?'▼':''} ${Math.abs(ch).toFixed(ch&&Math.abs(ch)<10?1:0)}%</span>`}
function niceMax(m){if(m<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(m)));const f=m/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function vchart(data,fmt=fmtK){if(!data.length)return '<div class="empty">No data in this range.</div>';const mx=niceMax(Math.max(...data.map(d=>d.v),0)/4)*4;const ticks=[1,.75,.5,.25,0];const every=Math.max(1,Math.ceil(data.length/10));
 return `<div class="vchart" role="img" aria-label="Bar chart"><div class="vy">${ticks.map(t=>`<span>${fmt(mx*t)}</span>`).join('')}</div><div class="vplot"><div class="vgrid">${ticks.map(()=>'<i></i>').join('')}</div><div class="vbars">${data.map(d=>`<div class="vcol" tabindex="0" data-tip="${esc(d.tip)}"><div class="vbar" style="height:${(d.v/mx*100).toFixed(2)}%"></div></div>`).join('')}</div><div class="vx">${data.map((d,i)=>`<span>${i%every===0?esc(d.label):''}</span>`).join('')}</div></div></div>`}
function hbars(rows,{fmt=money,cls='',max}={}){if(!rows.length)return '<div class="empty">Nothing in this range.</div>';const mx=max||Math.max(...rows.map(r=>r.v),0)||1;
 return `<div class="hbars">${rows.map(r=>`<div class="hrow" data-tip="${esc(r.tip||r.label+': '+fmt(r.v))}" tabindex="0"><span class="hl">${esc(r.label)}</span><div class="htrack ${r.cls||cls}"><i style="width:${(r.v/mx*100).toFixed(1)}%"></i></div><span class="hv">${r.right??fmt(r.v)}</span></div>`).join('')}</div>`}
function buckets(a,b){const end=Math.min(b,Date.now());if(end-a<=DAY+1){const out=[];for(let h=8;h<=21;h++){const s=a+h*36e5;out.push({a:s,b:s+36e5,label:(h%12||12)+(h<12?'a':'p'),long:new Date(s).toLocaleString('en-CA',{hour:'numeric'})})}out[0].a=a;out.at(-1).b=end+1;return out}
 const days=Math.ceil((end-a)/DAY);const step=days>120?7:1;const out=[];let s=a;while(s<end){const e=s+step*DAY;out.push({a:s,b:e,label:new Date(s).toLocaleDateString('en-CA',{month:'short',day:'numeric'}),long:step===7?'Week of '+fmtD(s):new Date(s).toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'})});s=e}return out}

function sellPrice(cost){const st=(S&&S.settings)||{};const m=st.markup!=null?+st.markup:40;return r2(st.markupType==='amt'?(+cost||0)+m:(+cost||0)*(1+m/100))}
function repriceAll(){let n=0;for(const p of S.products){if(p.manualPrice||p.vendor==='Bought from customer')continue;const np=sellPrice(p.cost);if(np!==p.price){p.price=np;n++}}return n}
function minPrice(p){const st=S.settings;const d=+st.discMax||0;return r2(Math.max(0,st.discType==='amt'?p.price-d:p.price*(1-d/100)))}
const discText=()=>S.settings.discType==='amt'?money(S.settings.discMax):S.settings.discMax+'%';
function migrate(){const st=S.settings;if(st.markupType==null)st.markupType='pct';if(st.discType==null)st.discType='pct';if(st.discMax==null)st.discMax=10}

 if(v<lo&&!isMgr()){toast(`Lowest price for this item is ${money(lo)} (max discount ${discText()}). Ask a manager for more.`);v=lo}

/* ---- till cash: sales + cash repairs − cash refunds − cash paid out ---- */
function shiftCash(sh){let cash=0,card=0,repairs=0,refunds=0,paidOut=0;
 for(const s of S.sales)if(s.shiftId===sh.id){cash+=s.pay.cash;card+=s.pay.card}
 for(const r of S.returns)if(r.shiftId===sh.id){if(r.collected){cash+=r.collected.cash||0;card+=r.collected.card||0}if(r.refunded){if(r.refunded.method==='cash'){cash-=r.refunded.amount;refunds+=r.refunded.amount}}}
 for(const r of S.repairs)if(r.payment&&r.payment.shiftId===sh.id){if(r.payment.method==='cash'){cash+=r.payment.amount;repairs+=r.payment.amount}else card+=r.payment.amount}
 for(const e of S.expenses||[])if(e.shiftId===sh.id&&e.method==='cash'){cash-=e.amount;paidOut+=e.amount}
 return{cash:r2(cash),card:r2(card),repairs:r2(repairs),refunds:r2(refunds),paidOut:r2(paidOut)}}

function storeDay(sid,a,b){const ins=x=>(sid==='all'||x.storeId===sid);
 const sales=S.sales.filter(s=>s.at>=a&&s.at<b&&ins(s));const lines=sales.flatMap(s=>s.items.map(i=>({s,i,p:P(i.pid)}))).filter(x=>x.p);
 const g=k=>lines.filter(x=>GROUP(x.p.category)===k).reduce((t,x)=>t+x.i.qty*x.i.price,0);
 const reps=S.repairs.filter(r=>r.payment&&r.payment.at>=a&&r.payment.at<b&&ins(r));const repIn=reps.reduce((t,r)=>t+r.payment.amount,0);
 const rets=S.returns.filter(r=>r.at>=a&&r.at<b&&ins(r));const refunds=rets.reduce((t,r)=>t+Math.max(0,r.net),0);const refCash=rets.filter(r=>r.refunded&&r.refunded.method==='cash').reduce((t,r)=>t+r.refunded.amount,0);
 const ex=(S.expenses||[]).filter(e=>e.at>=a&&e.at<b&&ins(e));const et=t=>ex.filter(e=>e.type===t).reduce((s,e)=>s+e.amount,0);
 const sh=S.shifts.filter(x=>x.openAt>=a&&x.openAt<b&&ins(x));
 const tech=S.repairs.filter(r=>!r.inShop&&ins(r)&&r.repairCost!=null).filter(r=>{const h=r.history.find(h=>['fixed','notfix'].includes(h.status));return h&&h.at>=a&&h.at<b}).reduce((t,r)=>t+(r.repairCost||0)+(r.shipCost||0),0);
 const bat=S.batches.filter(x=>x.at>=a&&x.at<b&&ins(x)).reduce((t,x)=>t+x.lines.reduce((u,l)=>u+l.received*l.cost,0)+(x.shipping||0),0);
 const cogs=lines.reduce((t,x)=>t+x.i.qty*x.p.cost,0);
 const wages=sh.reduce((t,x)=>t+hoursOf(x)*(U(x.userId).rate||0),0);
 return{sales,lines,phones:g('Phones'),acc:g('Accessories'),parts:g('Parts'),phonesN:lines.filter(x=>x.p.category==='Devices').reduce((t,x)=>t+x.i.qty,0),repIn,repN:reps.length,
  debit:sales.reduce((t,s)=>t+s.pay.card,0)+reps.filter(r=>r.payment.method!=='cash').reduce((t,r)=>t+r.payment.amount,0),cash:sales.reduce((t,s)=>t+s.pay.cash,0)+reps.filter(r=>r.payment.method==='cash').reduce((t,r)=>t+r.payment.amount,0),
  credit:sales.reduce((t,s)=>t+(s.pay.credit||0),0),refunds,refCash,rets,exch:rets.filter(r=>r.exch.length).length,expense:et('expense'),rent:et('rent'),phoneBuy:et('phone'),phoneBuyN:ex.filter(e=>e.type==='phone').length,empBuy:et('employee'),ownerBuy:et('owner'),ex,
  deposit:sh.filter(x=>x.closeAt).reduce((t,x)=>t+x.declared,0),till:sh.filter(x=>x.closeAt).reduce((t,x)=>t+((x.counted??(x.opening+x.declared))-x.declared),0),sh,tech,bat,cogs,wages}}
function pl(d){const total=d.phones+d.acc+d.parts+d.repIn;const net=total-d.refunds;const gross=net-d.cogs-d.tech;const netp=gross-d.expense-d.rent-d.wages;return{total,net,gross,netp}}

 for(let i=0;i<120;i++){const sid=pick(['s1','s2','s3','s4']);const [dev,dm,price]=pick(quick);const at=now-ri(0,95)*DAY+ri(10,16)*36e5;const by=staffBy[sid][0];const id='RP-'+(++D.seq.repair);const fixAt=at+ri(1,5)*36e5;const colAt=fixAt+ri(1,48)*36e5;const collected=colAt<now-2*36e5;
  const r={id,storeId:sid,customer:pick(['Kai Morgan','Lena Ortiz','Raj Mehta','Zoe Carter','Omar Siddiqui','Grace Liu','Ben Walsh','Sara Kim','Noel Price']),phone:'250-555-01'+ri(10,99),device:dev,imei:'35'+ri(1e6,9e6)+ri(1e6,9e6),damage:[dm],desc:dm+' replacement',status:collected?'collected':'fixed',createdAt:at,by,expected:isoD(at+DAY),tech:null,inShop:true,price,complexity:'Simple',repairCost:null,shipCost:null,techNotes:'',history:[{at,by,status:'intake',note:'Checked in — repairing in shop'},{at:fixAt,by,status:'fixed',note:'Fixed in shop'}]};
  if(collected){r.history.push({at:colAt,by,status:'collected',note:'Paid'});r.payment={amount:price,method:R()<.45?'cash':'card',at:colAt,by,storeId:sid,shiftId:null}}

/* ============ Import existing (opening) stock — one file for all shops ============ */
const OPEN_COLS=[
 ['store','Yes','Shop name exactly as in the system. Leave empty to import into the shop you are working in.','Douglas St'],

 ['mpn','','Manufacturer part number','77-92605'],['upc','','Barcode on the retail box, if any',''],['imei','','Only for phones','356789012345678'],

const openTemplateCSV=()=>OPEN_COLS.map(c=>c[0]).join(',')+'\n'+[
 'Douglas St,107082022456,"Replacement Battery For iPhone 13 (AmpSentrix Basic Extended)",Batteries,AmpSentrix,iPhone 13,Parts Supplier,,,,19.09,,3,1',
 'Douglas St,107182116868,"LCD Assembly For iPhone 17 Pro Max (Aftermarket: AQ7 / Incell) (120HZ)",Screens,,iPhone 17 Pro Max,Parts Supplier,,,,43.38,,2,1',
 'Hillside Ave,15-11388,"iPhone 17e/16e/15/14/13 Otterbox Commuter Series Case - Black",Cases,OtterBox,iPhone 15,Hitfar,77-92605,,,29.17,,4,1',
 'Hillside Ave,120-10588,"Commuter Case w/Magnets Galaxy S26+ Black",Cases,OtterBox,Galaxy S26+,Cesium Telecom,7799801,,,26.40,,2,1',
 'Park Royal,,"Used iPhone 13 128GB — Grade B",Devices,Apple,iPhone 13,Bought from customer,,,356789012345678,300.00,449.99,1,0'].join('\n')+'\n';
const OSYN={store:['store','shop','location'],sku:['sku','vendor_sku','product sku','item code','code'],product_name:['product_name','name','product','description','product description','item description'],category:['category'],brand:['brand'],model:['model','fits'],vendor:['vendor','supplier'],mpn:['mpn'],upc:['upc','barcode'],imei:['imei','serial'],unit_cost:['unit_cost','cost','base price','unit price'],sell_price:['sell_price','price','retail','selling price'],qty_on_hand:['qty_on_hand','qty','quantity','on hand','stock'],min_stock:['min_stock','threshold','min']};
function startOpening(text,fileName){const rows=parseCSV(text);if(rows.length<2){toast('That file has no data rows.');return}
 const h=rows[0].map(x=>x.trim().toLowerCase());const ix={};for(const k in OSYN){ix[k]=-1;for(const s of OSYN[k]){const i=h.indexOf(s);if(i>=0){ix[k]=i;break}}}
 const g=(r,k)=>ix[k]>=0?String(r[ix[k]]??'').trim().replace(/^'/,''):'';const stByName=n=>S.stores.find(s=>s.name.toLowerCase()===n.toLowerCase());
 const lines=rows.slice(1).map((r,n)=>{const errs=[];const sn=g(r,'store');const st=sn?stByName(sn):(curStore()!=='all'?ST(curStore()):null);if(!st)errs.push(sn?`Unknown store "${sn}"`:'Store missing');
  const name=g(r,'product_name');const sku=g(r,'sku');const match=(sku&&findByCode(sku))||(g(r,'upc')&&findByCode(g(r,'upc')))||(g(r,'imei')&&S.products.find(p=>p.imei===g(r,'imei')))||(!sku&&!g(r,'imei')&&name&&S.products.find(p=>p.name.toLowerCase()===name.toLowerCase()))||null;
  if(!name&&!match)errs.push('Product name missing');const q=g(r,'qty_on_hand');const qty_=parseInt(q);if(q===''||isNaN(qty_)||qty_<0)errs.push('Quantity missing');
  const cost=parseFloat(g(r,'unit_cost'));if(!match&&isNaN(cost))errs.push('Unit cost missing');let cat=g(r,'category');const cm=CATS.find(c=>c.toLowerCase()===cat.toLowerCase());cat=cm||(match?match.category:guessCat(name));
  return{n:n+2,sid:st&&st.id,name:name||(match&&match.name),sku,cat,brand:g(r,'brand'),model:g(r,'model'),vendor:g(r,'vendor'),mpn:g(r,'mpn'),upc:g(r,'upc'),imei:g(r,'imei'),cost:isNaN(cost)?(match?match.cost:0):r2(cost),price:g(r,'sell_price')===''?null:r2(parseFloat(g(r,'sell_price'))),qty:qty_,min:g(r,'min_stock'),match:match&&match.id,errs}}).filter(l=>l.name||l.errs.length<3);
 UI.open={fileName,lines,mode:'set'};UI.view='opening';render()}
VIEWS.opening=()=>{const O=UI.open;const head=`<div class="page-h"><div><h1>Import existing stock</h1><p>Load the stock that is already on your shelves, for every shop, from one CSV file. Use this once when you start, or after a full count. For new deliveries from a vendor, use <a href="#" data-act="go" data-v="receive">Receive stock</a> instead.</p></div><button class="btn" data-act="go" data-v="receive">Back to Receive stock</button></div>`;
 if(!O)return head+`<div class="cols"><div class="card card-b stack"><h2>Upload your stock file</h2><label class="field"><span>CSV file</span><input class="in" type="file" id="openFile" accept=".csv,text/csv" data-on="openFile"></label>
  <ol class="small" style="margin:0;padding-left:18px;display:grid;gap:4px"><li>Copy or download the template on the right.</li><li>Open it in Excel or Google Sheets. Add one row per product <b>per shop</b>.</li><li>Save as <b>CSV</b> and upload it here.</li><li>Check the preview, then press Import.</li></ol></div>
  <div class="card"><div class="card-h"><h2>Stock file template</h2><div class="row"><button class="btn sm" data-act="copyOpenTpl">${ic('copy')} Copy template</button>${FRAMED?'':`<button class="btn sm" data-act="dlOpenTpl">Download .csv</button>`}</div></div><div class="tbl-wrap" style="max-height:420px"><table class="tbl"><thead><tr><th>Column</th><th>Req.</th><th>What goes in it</th></tr></thead><tbody>${OPEN_COLS.map(c=>`<tr><td class="mono small">${c[0]}</td><td>${c[1]?pill('Yes','acc'):''}</td><td class="small">${esc(c[2])}${c[3]?`<div class="muted mono">e.g. ${esc(c[3])}</div>`:''}</td></tr>`).join('')}</tbody></table></div></div></div>`;
 const ok=O.lines.filter(l=>!l.errs.length),bad=O.lines.filter(l=>l.errs.length);const byStore=groupSum(ok,l=>l.sid,l=>l.qty);
 return head+`<div class="kpis">${kpi('Rows ready',ok.length,esc(O.fileName))}${kpi('New products',ok.filter(l=>!l.match).length,'created on import')}${kpi('Units',ok.reduce((a,l)=>a+l.qty,0),byStore.map(([s,v])=>esc(ST(s).name)+' '+v).join(' · '))}${kpi('Rows with problems',bad.length,bad.length?'fix in the file and upload again, or import the rest':'none')}</div>
 <div class="filters"><span class="small muted">For products already in the system:</span><div class="seg"><button class="${O.mode==='set'?'on':''}" data-act="openMode" data-v="set">Replace quantity with the file</button><button class="${O.mode==='add'?'on':''}" data-act="openMode" data-v="add">Add file quantity to current stock</button></div></div>
 <div class="card"><div class="tbl-wrap" style="max-height:60vh"><table class="tbl"><thead><tr><th>Row</th><th>Store</th><th>Product</th><th>Category</th>${isMgr()?'<th class="right">Base price</th>':''}<th class="right">Sell price</th><th class="right">Now</th><th class="right">After import</th></tr></thead><tbody>
 ${O.lines.map(l=>{const now=l.sid&&l.match?qty(l.sid,l.match):0;const after=O.mode==='add'?now+(l.qty||0):l.qty;const price=l.price??(l.match?P(l.match).price:sellPrice(l.cost));
  return `<tr${l.errs.length?' style="background:var(--danger-soft)"':''}><td class="num small muted">${l.n}</td><td>${l.sid?esc(ST(l.sid).name):'—'}</td><td class="wrap">${l.match?pill('Existing','ok'):pill('New','info')} ${esc(l.name||'')}${l.errs.length?`<div class="small diff-neg">${l.errs.map(esc).join(' · ')}</div>`:`<div class="small mono muted">${esc(l.sku||'code made on import')}${l.imei?' · IMEI '+esc(l.imei):''}</div>`}</td><td>${esc(l.cat)}</td>${isMgr()?`<td class="right num">${money(l.cost)}</td>`:''}<td class="right num">${money(price)}</td><td class="right num">${now}</td><td class="right num"><b>${l.errs.length?'—':after}</b></td></tr>`}).join('')}</tbody></table></div></div>
 <div class="card card-b row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-act="openCancel">Cancel</button><button class="btn pri lg" data-act="openApply" ${ok.length?'':'disabled'}>Import ${ok.length} row${ok.length===1?'':'s'}</button></div>`};
ACCESS.super.push('opening');ACCESS.admin.push('opening');

ACT.openApply=()=>{const O=UI.open;let created=0,units=0;const per={};
 for(const l of O.lines.filter(l=>!l.errs.length)){let p=l.match&&P(l.match);
  if(!p){const n=800000+S.products.length+Math.floor(Math.random()*9e4);const used=/bought from customer/i.test(l.vendor);
   p={id:uid('p'),ean:ean13(n),vendorSku:l.sku||('OS-'+n),upc:l.upc,mpn:l.mpn,name:l.name,category:l.cat,brand:l.brand,model:l.model,vendor:l.vendor||'Opening stock',cost:l.cost,price:l.price??sellPrice(l.cost),manualPrice:l.price!=null||used,threshold:l.min!==''&&!isNaN(+l.min)?+l.min:null,imei:l.imei||undefined,createdAt:Date.now()};S.products.push(p);created++}

 log('IMPORT',`Imported existing stock from ${O.fileName}: ${Object.values(per).reduce((a,b)=>a+b,0)} rows, ${created} new products, ${units} units (${Object.entries(per).map(([s,n])=>ST(s).name+' '+n).join(', ')})`,{storeId:'all'});
